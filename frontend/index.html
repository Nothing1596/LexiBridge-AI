<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBridge AI | Bilingual Course Knowledge Alignment</title>
  <script src="./js/config.js"></script>
  <style>
    :root {
      --navy: #07172c;
      --navy-2: #0c2642;
      --blue: #0f6f8f;
      --cyan: #1bb7d8;
      --gold: #b98a2c;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #13243a;
      --muted: #637083;
      --line: #dfe7ef;
      --green: #15803d;
      --red: #b42318;
      --amber: #b7791f;
      --shadow: 0 16px 36px rgba(7, 23, 44, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(135deg, #07172c 0%, #102f4a 34%, #eef4f8 34%, #f8fbfd 100%);
      background-size: 40px 40px, 40px 40px, auto;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary { background: #e8eef5; color: var(--ink); }
    button.ghost { background: transparent; color: #dceaff; border: 1px solid rgba(255,255,255,0.2); }
    button.gold { background: var(--gold); }
    button.danger { background: var(--red); }
    button.small { padding: 7px 10px; font-size: 13px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea { min-height: 96px; resize: vertical; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 28px;
      background: rgba(7, 23, 44, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
    }

    .brand {
      color: #fff;
      font-weight: 900;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: var(--navy);
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: #dceaff;
      padding: 8px 10px;
      font-weight: 700;
    }

    nav button.active,
    nav button:hover {
      border-color: rgba(27, 183, 216, 0.45);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px;
    }

    .hero {
      min-height: calc(100vh - 110px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: center;
      color: #fff;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(44px, 8vw, 92px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .hero h2 {
      margin: 0 0 14px;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.16;
      letter-spacing: 0;
      color: #e7f5ff;
    }

    .hero p {
      max-width: 820px;
      color: #d5e4f0;
      line-height: 1.72;
      font-size: 17px;
    }

    .hero-panel {
      background: rgba(255,255,255,0.94);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .hero-panel h3 { margin: 0 0 12px; }
    .hero-panel ol { margin: 0; padding-left: 22px; line-height: 1.75; color: var(--muted); }

    .section {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(223,231,239,0.9);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 24px;
      margin: 22px 0;
    }

    .section h2, .section h3 { margin: 0 0 12px; }
    .muted { color: var(--muted); line-height: 1.65; }
    .bilingual {
      display: block;
      line-height: 1.35;
    }
    .bilingual .cn, .bilingual .en {
      display: block;
    }
    .bilingual .en {
      color: var(--muted);
      font-size: 0.9em;
      font-weight: 650;
    }
    button .bilingual .en,
    .badge .bilingual .en {
      color: inherit;
      font-size: 0.82em;
      opacity: 0.82;
    }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .card h3, .card h4 { margin: 0 0 8px; }
    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #e8eef5;
      color: var(--navy);
    }

    .badge.good { background: #dcfce7; color: var(--green); }
    .badge.warn { background: #fff7d6; color: var(--amber); }
    .badge.bad { background: #fee4e2; color: var(--red); }
    .badge.blue { background: #e6f7fb; color: var(--blue); }
    .badge.neutral { background: #eef2f7; color: #526274; }

    .snippet {
      max-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .split-panel {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .review-queue-list {
      max-height: 760px;
      overflow: auto;
      display: grid;
      gap: 10px;
    }

    .review-item {
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 7px;
      width: 100%;
    }

    .review-item.active {
      border-color: #8edbea;
      box-shadow: 0 0 0 3px rgba(14, 165, 193, 0.12);
    }

    .review-action {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfdff;
    }

    .review-action summary { cursor: pointer; font-weight: 800; }

    .progress {
      height: 8px;
      background: #e8eef5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
    }

    .quote {
      border-left: 4px solid var(--cyan);
      background: #f7fbfd;
      padding: 12px;
      border-radius: 8px;
      color: #27384d;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    th, td {
      padding: 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th { color: var(--muted); background: #f6f9fc; }
    tr:last-child td { border-bottom: 0; }

    .notice {
      border: 1px solid #c6e7f0;
      background: #effaff;
      color: #16465a;
      padding: 12px;
      border-radius: var(--radius);
      line-height: 1.6;
    }

    .error { border-color: #fecaca; background: #fff1f2; color: #991b1b; }
    .success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 92px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .sidebar button {
      width: 100%;
      text-align: left;
      margin: 3px 0;
      background: transparent;
      color: var(--ink);
      border: 1px solid transparent;
    }

    .sidebar button.active {
      background: #e6f7fb;
      border-color: #bdebf5;
      color: var(--blue);
    }

    .user-chip {
      color: #fff;
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .statusbar {
      display: none;
      position: sticky;
      top: 70px;
      z-index: 4;
      padding: 9px 28px;
      background: rgba(12, 38, 66, 0.94);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      color: #dceaff;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .statusbar.visible { display: flex; }
    .statusbar .badge { background: rgba(255,255,255,0.12); color: #eef8ff; }
    .statusbar .badge.warn { background: rgba(255, 247, 214, 0.14); color: #ffe2a0; }
    .statusbar .badge.bad { background: rgba(254, 228, 226, 0.14); color: #ffb4aa; }

    .workspace-header {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.7fr);
      gap: 14px;
      align-items: start;
      margin-bottom: 16px;
    }

    .metric {
      display: grid;
      gap: 3px;
    }

    .metric strong {
      font-size: 28px;
      line-height: 1;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .statusbar { position: static; padding: 10px 16px; }
      .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 34px; }
      .grid, .grid.two, .grid.four, .form-grid, .app-layout, .workspace-header, .split-panel { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">LB</div>
      <div>
        <div>LexiBridge AI</div>
        <small>AI 双语课程知识对齐平台 / Bilingual Course Knowledge Alignment</small>
      </div>
    </div>
    <nav id="topNav"></nav>
    <div id="userChip" class="user-chip"></div>
  </header>
  <div id="statusBar" class="statusbar"></div>

  <main id="app"></main>

  <script>
    const API_BASE = (window.LEXIBRIDGE_CONFIG && window.LEXIBRIDGE_CONFIG.API_BASE) || "http://127.0.0.1:5000";

    const state = {
      token: localStorage.getItem("lexibridge_token") || "",
      user: null,
      page: "home",
      currentCourseId: localStorage.getItem("lexibridge_current_course_id") || "",
      qcFilter: "all",
      selectedRun: null,
      message: "",
      messageType: "notice",
      courseSearch: "",
      reviewFilters: {
        status: "",
        course: "",
        chapter: "",
        risk_label: "",
        q: "",
        page: 1,
        per_page: 20
      },
      studentCardFilters: {
        course: "",
        chapter: "",
        q: "",
        favorited: "",
        mastered: "",
        page: 1,
        per_page: 20
      },
      teacherFeedbackFilters: {
        course: "",
        status: "",
        feedback_type: "",
        q: "",
        page: 1,
        per_page: 20
      },
      teacherAnalyticsFilters: {
        course: "",
        chapter: "",
        limit: 20
      },
      selectedReviewCardUid: "",
      selectedStudentConceptCardUid: "",
      pendingVerification: null,
      pendingReset: null,
      systemStatus: null,
      cache: {
        courses: [],
        myCourses: [],
        cards: [],
        documents: [],
        plans: [],
        qc: [],
        users: [],
        sources: [],
        versions: [],
        usage: null,
        logs: [],
        billing: [],
        jobs: [],
        alignmentRuns: [],
        evaluationRuns: [],
        feedback: [],
        reviewQueue: [],
        reviewHistory: [],
        reviewCard: null,
        reviewPagination: null,
        studentConceptCards: [],
        studentConceptCard: null,
        studentConceptPagination: null,
        studentCourses: [],
        studentVisibilityError: "",
        studentProgress: null,
        conceptCardFeedbackQueue: [],
        conceptCardFeedbackPagination: null,
        teacherLearningAnalytics: null,
        teacherAnalyticsCards: [],
        teacherAnalyticsPagination: null,
        backlog: [],
        pilotReport: "",
        aiGovernance: null,
        retrievalDiagnostics: null,
        usageRecords: []
      }
    };

    const publicPages = [
      ["home", bilingual("首页", "Home")],
      ["product", bilingual("产品", "Product")],
      ["workflow", bilingual("工作流", "Workflow")],
      ["pricing", bilingual("价格", "Pricing")],
      ["login", bilingual("登录", "Login")],
      ["register", bilingual("注册", "Register")]
    ];

    const sharedPages = [
      ["dashboard", bilingual("工作台", "Dashboard")],
      ["courses", bilingual("课程", "Courses")],
      ["search", bilingual("术语检索", "Terminology Search")],
      ["studentConceptCards", bilingual("课程概念卡", "Concept Cards")],
      ["jobs", bilingual("任务状态", "Job Status")],
      ["diagnostics", bilingual("诊断", "Diagnostics")],
      ["account", bilingual("账号中心", "Account Center")]
    ];

    const rolePages = {
      student: [
        ["personal", bilingual("个人工作区", "Personal Workspace")],
        ["personalUpload", bilingual("上传个人资料", "Upload Personal Document")],
        ["learning", bilingual("收藏与学习", "Favorites & Learning")],
        ["subscription", bilingual("会员与用量", "Subscription & Usage")]
      ],
      teacher: [
        ["teacher", bilingual("教师工作台", "Teacher Dashboard")],
        ["courseUpload", bilingual("课程资料上传", "Courseware Upload")],
        ["courseKb", bilingual("课程知识库", "Course Knowledge Base")],
        ["alignmentRuns", bilingual("对齐运行", "Alignment Runs")],
        ["conceptReview", bilingual("概念卡审核", "Concept Review")],
        ["qc", bilingual("质量控制", "Quality Control")],
        ["feedback", bilingual("学生反馈", "Student Feedback")]
      ],
      admin: [
        ["admin", bilingual("管理员后台", "Admin Dashboard")],
        ["users", bilingual("用户管理", "User Management")],
        ["adminCourses", bilingual("课程管理", "Course Management")],
        ["sources", bilingual("知识源", "Knowledge Sources")],
        ["versions", bilingual("知识库版本", "KB Versions")],
        ["plans", bilingual("会员套餐", "Subscription Plans")],
        ["evaluationRuns", bilingual("评估运行", "Evaluation Runs")],
        ["aiGovernance", bilingual("AI 治理", "AI Governance")],
        ["retrievalDiagnostics", bilingual("检索诊断", "Retrieval Diagnostics")],
        ["backlog", bilingual("迭代待办", "Iteration Backlog")],
        ["pilotReport", bilingual("试点报告", "Pilot Report")],
        ["logs", bilingual("系统日志", "System Logs")]
      ]
    };

    function bilingual(cn, en) {
      return `<span class="bilingual"><span class="cn">${escapeHtml(cn)}</span><span class="en">${escapeHtml(en)}</span></span>`;
    }

    function setMessage(text, type = "notice") {
      state.message = text || "";
      state.messageType = type;
      render();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const ERROR_MESSAGES = {
      AUTH_REQUIRED: "请先登录 / Please log in first",
      TOKEN_EXPIRED: "登录已过期，请重新登录 / Session expired, please log in again",
      PERMISSION_DENIED: "当前账号无权执行该操作 / Current account has no permission",
      RESOURCE_NOT_FOUND: "资源不存在 / Resource not found",
      VALIDATION_ERROR: "请检查输入 / Please check the input",
      FILE_TOO_LARGE: "文件过大 / File too large",
      UNSUPPORTED_FILE_TYPE: "文件类型不支持 / Unsupported file type",
      OCR_UNAVAILABLE: "当前未配置 OCR 引擎 / OCR engine is not configured",
      FORMULA_OCR_UNAVAILABLE: "当前未配置公式 OCR 引擎 / Formula OCR engine is not configured",
      PARSING_FAILED: "文档解析失败 / Document parsing failed",
      QUOTA_EXCEEDED: "会员额度不足 / Subscription quota exceeded",
      AI_PROVIDER_FAILED: "AI 服务调用失败 / AI provider failed",
      PDF_FONT_UNAVAILABLE: "PDF 字体不可用 / PDF font unavailable",
      TOO_MANY_REQUESTS: "请求过于频繁 / Too many requests",
      INTERNAL_ERROR: "系统内部错误 / Internal server error"
    };

    function friendlyError(payload, fallback) {
      const code = payload && payload.error_code;
      const mapped = code && ERROR_MESSAGES[code] ? ERROR_MESSAGES[code] : "";
      const message = payload && (payload.message || payload.error);
      return [mapped, message || fallback].filter(Boolean).join(" · ");
    }

    function formatApiError(error, fallback = "Operation failed") {
      const payload = error && error.payload ? error.payload : {};
      const requestId = payload.request_id ? ` · request_id=${payload.request_id}` : "";
      const details = payload.details || {};
      const auditCode = details.audit_error_code ? ` · ${details.audit_error_code}` : "";
      return `${(error && error.message) || fallback}${auditCode}${requestId}`;
    }

    function defaultPageForRole(role) {
      if (role === "teacher") return "teacher";
      if (role === "admin") return "admin";
      return "dashboard";
    }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (!(options.body instanceof FormData)) headers["Content-Type"] = "application/json";
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
      let payload = {};
      try { payload = await response.json(); } catch (error) { payload = { status: "error", message: response.statusText }; }
      if (response.status === 401) {
        localStorage.removeItem("lexibridge_token");
        state.token = "";
        state.user = null;
        state.page = "login";
      }
      if (!response.ok) {
        const error = new Error(friendlyError(payload, `HTTP ${response.status}`));
        error.payload = payload;
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    async function loadMe() {
      if (!state.token) return null;
      try {
        const payload = await api("/api/auth/me");
        state.user = payload.user;
        state.systemStatus = payload.system_status || null;
        if (payload.system_status && payload.system_status.job_summary) {
          state.cache.jobSummary = payload.system_status.job_summary;
        }
        return state.user;
      } catch (error) {
        state.token = "";
        state.user = null;
        localStorage.removeItem("lexibridge_token");
        return null;
      }
    }

    function navItems() {
      if (!state.user) return publicPages;
      const items = [...sharedPages];
      const role = state.user.role;
      if (rolePages[role]) items.push(...rolePages[role]);
      if (role === "admin") items.push(...rolePages.teacher);
      return items;
    }

    function renderTopNav() {
      const nav = document.getElementById("topNav");
      nav.innerHTML = navItems().map(([id, label]) =>
        `<button class="${state.page === id ? "active" : ""}" ${id === "conceptReview" ? 'data-testid="concept-review-nav"' : id === "studentConceptCards" ? 'data-testid="student-concept-card-nav"' : ""} onclick="Lexi.goto('${id}')">${label}</button>`
      ).join("");
      const chip = document.getElementById("userChip");
      if (!state.user) {
        chip.innerHTML = `<button class="ghost small" onclick="Lexi.goto('login')">${bilingual("登录", "Login")}</button>`;
      } else {
        chip.innerHTML = `
          <span>${escapeHtml(state.user.email)}</span>
          <span class="badge blue">${escapeHtml(state.user.role)}</span>
          <button class="ghost small" onclick="Lexi.logout()">${bilingual("退出", "Logout")}</button>
        `;
      }
      renderStatusBar();
    }

    function selectedCourse() {
      const courseId = Number(state.currentCourseId || 0);
      return [...state.cache.myCourses, ...state.cache.courses].find(course => Number(course.id) === courseId) || null;
    }

    function renderStatusBar() {
      const bar = document.getElementById("statusBar");
      if (!bar) return;
      if (!state.user) {
        bar.className = "statusbar";
        bar.innerHTML = "";
        return;
      }
      const system = state.systemStatus || {};
      const ai = system.ai_provider || {};
      const ocr = system.ocr || {};
      const formula = system.formula_ocr || {};
      const jobs = system.job_summary || state.cache.jobSummary || {};
      const usage = state.cache.usage;
      const course = selectedCourse();

    const CARD_STATUS_LABELS = {
      auto_approved: ["AI 自动通过", "Auto Approved"],
      approved: ["教师已审核", "Teacher Approved"],
      pending_quality_control: ["待教师审核", "Needs Review"],
      needs_more_evidence: ["证据不足", "Needs Evidence"],
      conflict_detected: ["存在冲突", "Conflict"],
      needs_review: ["待审核", "Needs Review"],
      rejected: ["已驳回", "Rejected"],
      deprecated: ["已废弃", "Deprecated"],
      archived: ["已归档", "Archived"],
      draft: ["草稿", "Draft"]
    };

    const ALIGNMENT_STATUS_LABELS = {
      exact_match: ["概念一致", "Exact Match"],
      accepted_translation: ["译名可接受", "Accepted Translation"],
      partial_match: ["部分匹配", "Partial Match"],
      no_en_evidence: ["缺少英文证据", "Missing English Evidence"],
      no_zh_evidence: ["缺少中文证据", "Missing Chinese Evidence"],
      domain_mismatch: ["领域错配", "Domain Mismatch"],
      ocr_low_confidence: ["OCR 低置信", "OCR Low Confidence"],
      formula_evidence_missing: ["公式证据缺失", "Formula Evidence Missing"],
      unverified_translation: ["未验证译名", "Unverified Translation"],
      invalid_term_candidate: ["无效术语候选", "Invalid Term Candidate"],
      ambiguous_candidate: ["候选歧义", "Ambiguous Candidate"],
      multi_translation_conflict: ["多译名冲突", "Translation Conflict"]
    };

    const JOB_STATUS_LABELS = {
      draft: ["未发布", "Draft"],
      active: ["已发布", "Active"],
      queued: ["排队中", "Queued"],
      running: ["运行中", "Running"],
      completed: ["已完成", "Completed"],
      failed: ["失败", "Failed"],
      retrying: ["重试中", "Retrying"],
      canceled: ["已取消", "Canceled"]
    };

    function labelFor(map, key) {
      const label = map[key] || [key || "未知", key || "Unknown"];
      return bilingual(label[0], label[1]);
    }

    function badgeClassForStatus(status) {
      if (["auto_approved", "approved", "completed", "exact_match", "accepted_translation"].includes(status)) return "good";
      if (["rejected", "failed", "domain_mismatch", "invalid_term_candidate"].includes(status)) return "bad";
      return "warn";
    }

    function statusBadge(status, kind = "card") {
      const map = kind === "alignment" ? ALIGNMENT_STATUS_LABELS : kind === "job" ? JOB_STATUS_LABELS : CARD_STATUS_LABELS;
      return `<span class="badge ${badgeClassForStatus(status)}">${labelFor(map, status)}</span>`;
    }

    function renderCards(cards) {
	      if (!cards.length) return `<p class="muted">${bilingual("暂无术语卡片。", "No terminology cards loaded.")}</p>`;
      return cards.map(card => `
        <div class="card">
          <div class="between">
            <h3>${escapeHtml(card.english_term)} -> ${escapeHtml(card.final_chinese_term || card.ai_translation_candidate)}</h3>
            ${statusBadge(card.status)}
          </div>
          <p class="muted">${escapeHtml(card.concept_explanation || "No explanation yet.")}</p>
          <div class="progress"><span style="width:${Math.max(0, Math.min(100, card.confidence_score || 0))}%"></span></div>
          <p>
	            <span class="badge blue">${bilingual(`置信度 ${card.confidence_score || 0}`, `Confidence ${card.confidence_score || 0}`)}</span>
            <span class="badge">${escapeHtml(card.scope_type)}</span>
            ${statusBadge(card.alignment_status || "unverified_translation", "alignment")}
            <span class="badge">${escapeHtml(card.ai_provider || "provider")}:${escapeHtml(card.ai_model || "local")}</span>
          </p>
	          ${["pending_quality_control", "needs_more_evidence", "conflict_detected"].includes(card.status) ? `<div class="notice">${bilingual("该术语仍在审核或证据补充阶段，请谨慎使用。", "This term is still under review or evidence collection. Use it carefully.")}</div>` : ""}
	          ${["mock", "local_heuristic", "none"].includes(String(card.ai_provider || "").toLowerCase()) ? `<div class="notice error">${bilingual("该结果由本地规则或演示 AI 生成，尚未通过真实 AI 或教师审核。", "This result was generated by local rules or demo AI and has not been verified by live AI or teacher review.")}</div>` : ""}
	          <p class="muted">${bilingual(`证据分数：英文 ${(Number(card.english_evidence_score || 0)).toFixed(2)} / 中文 ${(Number(card.chinese_evidence_score || 0)).toFixed(2)} · Prompt ${escapeHtml(card.prompt_version || "alignment_v1")}`, `Evidence Score: EN ${(Number(card.english_evidence_score || 0)).toFixed(2)} / ZH ${(Number(card.chinese_evidence_score || 0)).toFixed(2)} · Prompt ${escapeHtml(card.prompt_version || "alignment_v1")}`)}</p>
	          ${Array.isArray(card.quality_flags) && card.quality_flags.length ? `<p>${card.quality_flags.map(flag => `<span class="badge bad">${bilingual(flag, flag)}</span>`).join(" ")}</p>` : ""}
	          ${Array.isArray(card.quality_flags) && card.quality_flags.includes("formula_evidence_missing") ? `<div class="notice">${bilingual("相关公式区域已检测，但当前缺少可用公式 OCR 证据。", "Related formula region was detected, but usable Formula OCR evidence is missing.")}</div>` : ""}
	          ${card.risk_note ? `<div class="notice error"><strong>${bilingual("风险提示", "Risk")}:</strong> ${escapeHtml(card.risk_note)}</div>` : ""}
	          <p class="muted"><strong>${bilingual("上下文", "Context")}:</strong> ${escapeHtml(card.courseware_sentence || "No context sentence.")}</p>
	          <div class="grid two">
	            <div class="quote"><strong>${bilingual("英文证据", "English Evidence")}</strong><br>${escapeHtml(card.english_kb_evidence || "No English evidence.")}</div>
	            <div class="quote"><strong>${bilingual("中文证据", "Chinese Evidence")}</strong><br>${escapeHtml(card.chinese_kb_evidence || "No Chinese evidence.")}</div>
	          </div>
	          <p class="muted"><strong>${bilingual("对齐理由", "Alignment Reason")}:</strong> ${escapeHtml(card.alignment_reason || "")}</p>
	          <div class="row">
	            <button class="small secondary" onclick="Lexi.favorite(${card.id})">${bilingual("收藏", "Favorite")}</button>
	            <button class="small secondary" onclick="Lexi.mastered(${card.id})">${bilingual("已掌握", "Mastered")}</button>
	            <button class="small secondary" onclick="Lexi.feedback(${card.id})">${bilingual("反馈", "Feedback")}</button>
	          </div>
        </div>
      `).join("");
    }

	    function renderUpload(scope) {

	        <div class="notice">${bilingual("PDF、PPTX、DOCX、TXT 会做基础文本解析；图片或扫描型 PDF 会调用配置的 OCR Provider。OCR 不可用时不会生成伪造文本或术语卡片。", "PDF, PPTX, DOCX, and TXT use native text parsing; images or scanned PDFs call the configured OCR Provider. If OCR is unavailable, the system does not fabricate text or terminology cards.")}</div>

    function renderDocuments(documents) {
	      if (!documents.length) return `<p class="muted">${bilingual("暂无文档。", "No documents loaded.")}</p>`;

	        const job = state.cache.jobs.find(item => Number(item.document_id) === Number(doc.id));

	          ${job ? `<p>${statusBadge(job.status, "job")} <span class="badge">Job #${job.id}</span> <span class="badge">${bilingual(`进度 ${job.progress_percent || 0}%`, `Progress ${job.progress_percent || 0}%`)}</span></p>` : ""}
	          ${doc.ocr_error ? `<div class="notice error">${escapeHtml(doc.ocr_error)}</div>` : ""}
	          ${(doc.formula_status && !["ok", "not_required"].includes(doc.formula_status)) ? `<div class="notice">${bilingual("检测到公式区域，但当前公式 OCR 未完全可用。", "Formula regions were detected, but Formula OCR is not fully available.")}</div>` : ""}
	          ${["teacher", "admin"].includes(state.user.role) && doc.scope_type === "course" ? `<div class="row"><button class="small secondary" onclick="Lexi.runAlignmentForDocument(${doc.id}, ${doc.course_id || "null"}, '${doc.scope_type}')">${bilingual("触发术语对齐", "Run Alignment")}</button></div>` : ""}

      `}).join("");

    function arrayValue(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      if (typeof value === "string") {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return value.trim() ? [value] : [];
        }
      }
      return typeof value === "object" ? [value] : [];
    }

    function riskChips(labels, tone = "bad") {
      const items = arrayValue(labels);
      if (!items.length) return `<span class="badge neutral">${bilingual("无风险标签", "No risk labels")}</span>`;
      return items.map(label => `<span class="badge ${tone}">${escapeHtml(label)}</span>`).join(" ");
    }

    function evidenceScore(item) {
      const score = item.score ?? item.retrieval_score ?? item.evidence_score ?? item.lexical_score;
      return score === undefined || score === null || score === "" ? "-" : Number(score).toFixed(2);
    }

    function renderEvidenceItems(items, emptyText) {
      const evidence = arrayValue(items);
      if (!evidence.length) return `<div class="notice error">${emptyText}</div>`;
      return `<div class="stack">${evidence.slice(0, 8).map(item => {
        if (typeof item === "string") {
          return `<div class="quote snippet">${escapeHtml(item.slice(0, 600))}</div>`;
        }
        const snippet = String(item.snippet || item.text || item.content_excerpt || item.evidence_snippet || "").slice(0, 600);
        return `
          <div class="quote">
            <div class="between">
              <strong>${escapeHtml(item.source_title || item.source_uid || "Evidence")}</strong>
              <span class="badge blue">${bilingual(`分数 ${evidenceScore(item)}`, `Score ${evidenceScore(item)}`)}</span>
            </div>
            <p class="muted">${escapeHtml(item.source_role || item.source_type || "-")} · ${escapeHtml(item.trust_level || "-")} · ${escapeHtml(item.quality_status || "-")} · ${escapeHtml(item.source_locator || item.page_number || item.slide_number || "-")}</p>
            <div class="snippet">${escapeHtml(snippet || "No snippet.")}</div>
            ${Array.isArray(item.risk_labels) && item.risk_labels.length ? `<p>${riskChips(item.risk_labels, "warn")}</p>` : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    function renderVerificationSummary(card) {
      const verification = card.verification_summary || (card.latest_review_summary && card.latest_review_summary.verification_run_uid ? { run_uid: card.latest_review_summary.verification_run_uid } : null);
      if (!verification) {
        return `<div class="notice">${bilingual("暂无对齐验证运行摘要。", "No alignment verification run summary is linked yet.")}</div>`;

    async function loadReviewQueue() {
      if (!state.user || !["teacher", "admin"].includes(state.user.role)) return;
      const query = reviewQueryString();
      const payload = await api(`/api/concept-cards/review-queue${query ? `?${query}` : ""}`);
      const data = payload.data || {};
      state.cache.reviewQueue = data.items || [];
      state.cache.reviewPagination = data.pagination || null;
      if (!state.selectedReviewCardUid && state.cache.reviewQueue.length) {
        state.selectedReviewCardUid = state.cache.reviewQueue[0].card_uid;
      }
      if (state.selectedReviewCardUid) {
        const stillVisible = state.cache.reviewQueue.some(card => card.card_uid === state.selectedReviewCardUid);
        if (!stillVisible && state.cache.reviewQueue.length) state.selectedReviewCardUid = state.cache.reviewQueue[0].card_uid;
        await loadReviewCard(state.selectedReviewCardUid);
      } else {
        state.cache.reviewCard = null;
        state.cache.reviewHistory = [];
      }
    }

    async function loadReviewCard(cardUid) {
      if (!cardUid) return;
      const [cardPayload, reviewsPayload] = await Promise.all([
        api(`/api/concept-cards/${encodeURIComponent(cardUid)}`),
        api(`/api/concept-cards/${encodeURIComponent(cardUid)}/reviews?per_page=50`)
      ]);
      const card = (cardPayload.data && cardPayload.data.card) || cardPayload.card || {};
      const queueItem = (state.cache.reviewQueue || []).find(item => item.card_uid === cardUid) || {};
      state.cache.reviewCard = { ...queueItem, ...card };
      state.cache.reviewHistory = (reviewsPayload.data && reviewsPayload.data.items) || [];
      const verification = (queueItem && queueItem.verification_summary) || null;
      if (verification) state.cache.reviewCard.verification_summary = verification;
    }

      });
      return params.toString();

      try {

        const data = payload.data || {};
        state.cache.studentCourses = data.items || [];
        state.cache.studentVisibilityError = "";
      } catch (error) {
        state.cache.studentCourses = [];
        state.cache.studentVisibilityError = formatApiError(error, "Course visibility failed.");
      }

    async function loadStudentProgress() {
      if (!state.user) return;
      const params = new URLSearchParams();
      if (state.studentCardFilters.course) params.set("course", state.studentCardFilters.course);
      if (state.studentCardFilters.chapter) params.set("chapter", state.studentCardFilters.chapter);
      params.set("include_recent", "true");
      const payload = await api(`/api/student/progress?${params.toString()}`);
      state.cache.studentProgress = payload.data || null;

    async function loadStudentConceptCards() {
      if (!state.user) return;
      await loadStudentCourses();
      await loadStudentProgress();
      const query = studentConceptQueryString();
      const payload = await api(`/api/student/concept-cards${query ? `?${query}` : ""}`);
      const data = payload.data || {};
      state.cache.studentConceptCards = data.items || [];
      state.cache.studentConceptPagination = data.pagination || null;
      if (!state.selectedStudentConceptCardUid && state.cache.studentConceptCards.length) {
        state.selectedStudentConceptCardUid = state.cache.studentConceptCards[0].card_uid;
      }
      if (state.selectedStudentConceptCardUid) {
        const stillVisible = state.cache.studentConceptCards.some(card => card.card_uid === state.selectedStudentConceptCardUid);
        if (!stillVisible && state.cache.studentConceptCards.length) state.selectedStudentConceptCardUid = state.cache.studentConceptCards[0].card_uid;
        if (!stillVisible && !state.cache.studentConceptCards.length) state.selectedStudentConceptCardUid = "";
        if (state.selectedStudentConceptCardUid) await loadStudentConceptCard(state.selectedStudentConceptCardUid);
      } else {
        state.cache.studentConceptCard = null;
      }
    }

    async function loadStudentConceptCard(cardUid) {
      if (!cardUid) return;
      const payload = await api(`/api/student/concept-cards/${encodeURIComponent(cardUid)}`);
      state.cache.studentConceptCard = (payload.data && payload.data.card) || null;
      const index = (state.cache.studentConceptCards || []).findIndex(card => card.card_uid === cardUid);
      if (index >= 0 && state.cache.studentConceptCard) {
        state.cache.studentConceptCards[index] = { ...state.cache.studentConceptCards[index], ...state.cache.studentConceptCard };
      }
    }

          const qcCount = (payload.cards || []).filter(card => ["pending_quality_control", "needs_more_evidence", "conflict_detected"].includes(card.status)).length;
          const needsEvidenceCount = (payload.cards || []).filter(card => card.status === "needs_more_evidence" || card.alignment_status === "no_zh_evidence" || card.alignment_status === "no_en_evidence").length;
          const ocrStatus = payload.ocr_status || (payload.document ? payload.document.ocr_status : "not_required");
          const formulaStatus = payload.formula_status || (payload.document ? payload.document.formula_status : "not_required");
          const formulaCount = payload.formula_blocks_created || (payload.document ? payload.document.formula_blocks_count : 0) || 0;
          const warnings = (payload.warnings || []).slice(0, 3).join(" | ");
	          setMessage(`上传完成，生成 ${(payload.cards || []).length} 张术语卡片，需质量控制 ${qcCount} 张，证据不足 ${needsEvidenceCount} 张。OCR：${ocrStatus}；公式 OCR：${formulaStatus}；公式块：${formulaCount}${warnings ? `；警告：${warnings}` : ""} / Upload completed: ${(payload.cards || []).length} cards generated, ${qcCount} need QC, ${needsEvidenceCount} need more evidence. OCR: ${ocrStatus}; Formula OCR: ${formulaStatus}; Formula blocks: ${formulaCount}${warnings ? `; Warnings: ${warnings}` : ""}`, "success");
        } catch (error) {

          const doc = payload.document || {};
          const formulaStatus = payload.formula_status || doc.formula_status || "not_required";
          const formulaCount = payload.formula_blocks_created || doc.formula_blocks_count || 0;
          const warnings = (payload.warnings || []).slice(0, 3).join(" | ");
          setMessage(`${error.message} OCR：${doc.ocr_status || "not_required"}；公式 OCR：${formulaStatus}；公式块：${formulaCount}${warnings ? `；警告：${warnings}` : ""} / Upload failed. OCR: ${doc.ocr_status || "not_required"}; Formula OCR: ${formulaStatus}; Formula blocks: ${formulaCount}${warnings ? `; Warnings: ${warnings}` : ""}`, "notice error");
        }

            method: "POST",
            body: JSON.stringify({
              document_id: documentId,
              course_id: courseId || undefined,
              scope_type: scopeType || "course"
            })
          });
          await loadJobs();
          await loadAlignmentRuns();
          const data = payload.data || {};
          if (data.job_id) {
            setMessage(`术语对齐任务 #${data.job_id} 已排队。/ Alignment job #${data.job_id} has been queued.`, "success");
          } else {
            setMessage("术语对齐已完成。/ Alignment completed.", "success");
          }
        } catch (error) {
          setMessage(`${error.message} / Alignment failed.`, "notice error");
        }
      },
      async cancelJob(jobId) {
        try {
          await api(`/api/jobs/${jobId}/cancel`, { method: "POST", body: JSON.stringify({}) });
          await loadJobs();
          setMessage("任务已取消。 / Job canceled.", "success");
        } catch (error) {
          setMessage(`${error.message} / Cancel failed.`, "notice error");
        }
      },
      async retryJob(jobId) {
        try {
          await api(`/api/jobs/${jobId}/retry`, { method: "POST", body: JSON.stringify({}) });
          await loadJobs();
          setMessage("任务已重新排队。 / Job re-queued.", "success");
        } catch (error) {
          setMessage(`${error.message} / Retry failed.`, "notice error");
        }
      },
      async resolveFeedback(feedbackId) {
        try {
          const resolutionNote = prompt("Resolution note / 处理说明");
          if (!resolutionNote) return;
          const resolutionAction = prompt("Resolution action / 处理动作: card_updated / evidence_updated / marked_needs_more_evidence / student_misunderstanding / converted_to_backlog / converted_to_evaluation_item / no_action_needed", "no_action_needed") || "no_action_needed";
          await api(`/api/feedback/${feedbackId}/resolve`, {
            method: "POST",
            body: JSON.stringify({ resolution_note: resolutionNote, resolution_action: resolutionAction })
          });
          await loadFeedback();
          setMessage("反馈已标记处理。 / Feedback marked resolved.", "success");
        } catch (error) {
          setMessage(`${error.message} / Resolve feedback failed.`, "notice error");
        }
      },
      async triageFeedback(feedbackId, status) {
        try {
          await api(`/api/feedback/${feedbackId}/triage`, { method: "POST", body: JSON.stringify({ status }) });
          await loadFeedback();
          setMessage("反馈状态已更新。 / Feedback status updated.", "success");
        } catch (error) {
          setMessage(`${error.message} / Feedback triage failed.`, "notice error");
        }
      },
      async convertFeedbackToBacklog(feedbackId) {
        try {
          await api(`/api/feedback/${feedbackId}/convert-to-backlog`, { method: "POST", body: JSON.stringify({}) });
          await loadFeedback();
          await loadBacklog();
          setMessage("反馈已转为迭代待办。 / Feedback converted to backlog.", "success");
        } catch (error) {
          setMessage(`${error.message} / Convert to backlog failed.`, "notice error");
        }
      },
      async convertFeedbackToEvaluation(feedbackId) {
        const evaluationSetId = prompt("EvaluationSet ID / 评估集 ID");
        if (!evaluationSetId) return;
        try {
          await api(`/api/feedback/${feedbackId}/convert-to-evaluation`, {
            method: "POST",
            body: JSON.stringify({ evaluation_set_id: Number(evaluationSetId) })
          });
          await loadFeedback();
          setMessage("反馈已转为评估项。 / Feedback converted to evaluation item.", "success");
        } catch (error) {
          setMessage(`${error.message} / Convert to evaluation item failed.`, "notice error");
        }
      },
      async updateBacklogStatus(itemId, status) {
        try {
          await api(`/api/backlog/${itemId}/update-status`, { method: "POST", body: JSON.stringify({ status }) });
          await loadBacklog();
          setMessage("Backlog 状态已更新。 / Backlog status updated.", "success");
        } catch (error) {
          setMessage(`${error.message} / Update backlog failed.`, "notice error");
        }
      },
      async mockPayment(planId) {
        await api("/api/subscription/mock-payment", { method: "POST", body: JSON.stringify({ plan_id: planId }) });
        await loadSubscription();
	        setMessage("模拟支付完成，会员已开通。 / Mock payment completed. Subscription activated.", "success");
      },
      async qcAction(cardId, action) {
        const payload = {};
        if (action === "reject") {
          const reason = prompt("Rejected reason / 驳回原因");
          if (!reason) return;
          payload.rejected_reason = reason;
        }
        await api(`/api/quality-control/${cardId}/${action}`, { method: "POST", body: JSON.stringify(payload) });
        await loadQC();
	        setMessage("质量控制操作已完成。 / Quality control action completed.", "success");
      },
      async editCard(cardId) {
        const finalChineseTerm = prompt("Final Chinese term / 最终中文术语");
        if (!finalChineseTerm) return;
        const conceptExplanation = prompt("Concept explanation / 概念解释") || "";
        const reviewerNote = prompt("Reviewer note / 审核说明") || "";
        await api(`/api/quality-control/${cardId}/edit`, {
          method: "POST",
          body: JSON.stringify({
            final_chinese_term: finalChineseTerm,
            concept_explanation: conceptExplanation,
            reviewer_note: reviewerNote
          })
        });
        await loadQC();
        setMessage("术语卡已编辑并通过。 / Card edited and approved.", "success");
      },
      async createSource(event) {
        event.preventDefault();
        const form = new FormData(event.target);
        const payload = Object.fromEntries(form.entries());
        payload.allow_full_text_indexing = form.get("allow_full_text_indexing") === "on";
        payload.allow_student_search = form.get("allow_student_search") === "on";
        payload.allow_derivative_cards = form.get("allow_derivative_cards") === "on";
        await api("/api/knowledge/sources", { method: "POST", body: JSON.stringify(payload) });
        await loadKnowledge();
	        setMessage("知识源已创建。 / Knowledge source created.", "success");
      },
      async updateRole(userId, role) {
        await api(`/api/admin/users/${userId}/role`, { method: "POST", body: JSON.stringify({ role }) });
        await loadAdmin();
	        setMessage("用户角色已更新。 / User role updated.", "success");
      },
      loadEverything
    };

    window.Lexi = Lexi;

    (async function boot() {
      await loadPlans();
      if (state.token) {
        const user = await loadMe();
        if (user) {
          state.page = defaultPageForRole(user.role);
          await loadEverything();
        }
      }
      render();
    })().catch(error => {
      state.message = error.message;
      state.messageType = "notice error";
      render();
    });
  </script>
</body>
</html>
