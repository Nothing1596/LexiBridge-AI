name: CI

# Targets the current default branch (Dev). Add `main` here later if you
# normalize branch names. Branch names are case-sensitive on GitHub.
on:
  push:
    branches: [ Dev ]
  pull_request:
    branches: [ Dev ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Tests live in tests/ and import the backend via tests/conftest.py,
      # which puts backend/ on sys.path. pytest.ini pins testpaths + rootdir.
      - name: Run tests
        run: pytest
